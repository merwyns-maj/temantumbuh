# Makes an episode's voices, voice lines, music and sound effects with ElevenLabs, saves them in the repo,
# then renders the episode with sound. Needs the repository secret ELEVENLABS_API_KEY.
# Runs when video/<film>/script.json changes, or by hand: Actions > "Make audio" > Run workflow.
# Only new or changed files are made, so re-running costs nothing when nothing changed.
name: Make audio
on:
  workflow_dispatch:
    inputs:
      film:
        description: Folder under video/ to make audio for
        default: tunas-e01
  push:
    branches: [main]
    paths: ['video/*/script.json', 'video/tools/eleven_audio.py']

jobs:
  audio:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:   # only the audio step waits for an earlier one; renders can overlap
      group: audio-step-${{ inputs.film || 'tunas-e01' }}
      cancel-in-progress: false
    outputs:
      film: ${{ steps.which.outputs.film }}
      has_film: ${{ steps.which.outputs.has_film }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Which folder
        id: which
        run: |
          f="${{ inputs.film }}"
          if [ -z "$f" ]; then f=$(git diff --name-only HEAD~1 HEAD -- 'video/*/script.json' | head -1 | cut -d/ -f2); fi
          f=${f:-tunas-e01}
          echo "FILM=$f" >> "$GITHUB_ENV"; echo "film=$f" >> "$GITHUB_OUTPUT"
          if [ -f "video/$f/main.js" ]; then echo "has_film=true" >> "$GITHUB_OUTPUT"; else echo "has_film=false" >> "$GITHUB_OUTPUT"; fi
          echo "Folder: $f"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q elevenlabs
      - name: Make the audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python video/tools/eleven_audio.py "video/$FILM"
      - name: Save it in the repo
        if: always()
        run: |
          git add "video/$FILM/audio"
          git diff --cached --quiet && { echo "Nothing new."; exit 0; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Audio for $FILM (made by the Make audio workflow)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done

  render:
    needs: audio
    if: ${{ !cancelled() && needs.audio.outputs.has_film == 'true' }}
    uses: ./.github/workflows/render-video.yml
    with:
      film: ${{ needs.audio.outputs.film }}
      ref: main
